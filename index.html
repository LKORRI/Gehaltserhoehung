<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gehaltserhöhung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>Gehaltserhöhung</div>
    <div class="hud hidden" id="hud">
      <span class="chip-s" id="hBudget"></span>
      <span class="chip-s">😁 <span class="mbar"><span id="hTeam"></span></span> <span id="hTeamN"></span></span>
    </div>
  </div>
  <div id="app" class="screen"><p class="lead">Verbinde …</p></div>
</div>

<script type="module">
import { connect } from "./db.js";
import { CARDS, START_BUDGET, START_TEAM, SUBTITLE, REACTION_MS, play, score, euro, costOf } from "./cards.js";
import { card, delta, esc, LETTERS, randomId, store, session, avatar } from "./ui.js";
import { moodOf } from "./avatars.js";

const app = document.getElementById("app");
const hud = document.getElementById("hud");
const params = new URLSearchParams(location.search);
const g = (params.get("g") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

let db, pid, me = null, state = null;
let run = null; // { id, answers: [], startedAt }
let view = "intro"; // intro | card | end
let bubbleTimer = null;
let lastKey = "";

function setScreen(html, key) {
  if (key && key === lastKey) return false;
  lastKey = key || "";
  app.innerHTML = html;
  window.scrollTo(0, 0);
  return true;
}

function updateHud(s) {
  if (!s) return hud.classList.add("hidden");
  hud.classList.remove("hidden");
  const b = document.getElementById("hBudget");
  b.textContent = "💰 " + euro(s.budget);
  b.classList.toggle("neg", s.budget < 0);
  document.getElementById("hTeam").style.width = Math.max(0, Math.min(100, s.team)) + "%";
  document.getElementById("hTeamN").textContent = s.team;
}

const open = () => state && state.phase === "play";

function noGame() {
  setScreen(`
    <h1 class="big-title">Willkommen! 👋</h1>
    <p class="lead">Scanne den QR-Code am Beamer oder gib den Spielcode ein.</p>
    <form id="f"><input class="field" id="code" maxlength="6" placeholder="Spielcode" autocomplete="off" style="text-transform:uppercase">
    <button class="btn">Weiter</button></form>`, "nogame");
  document.getElementById("f").onsubmit = (e) => {
    e.preventDefault();
    const c = document.getElementById("code").value.trim().toUpperCase();
    if (c) location.search = "?g=" + encodeURIComponent(c) + (params.has("local") ? "&local" : "");
  };
}

function rulesHtml() {
  return `
    <div class="rules">
      <div>💬 <b>${CARDS.length} Leute wollen mehr Geld.</b> Du wählst jeweils eine von 3 Antworten. Achtung: Manches spricht sich rum …</div>
      <div>💰 Du hast <b>${euro(START_BUDGET)} Budget</b> und musst dein <b>Team bei Laune halten</b> 😁, damit niemand kündigt. Ist das Geld weg oder die Stimmung im Keller, <b>fliegst du raus.</b></div>
      <div>🏆 Am Ende zählen Teamzufriedenheit + Restbudget. <b>Die meisten Punkte holst du, wenn du so entscheidest wie die echte Raiffeisenbank.</b> Du kannst so oft spielen, wie du willst.</div>
    </div>`;
}

function joinScreen() {
  updateHud(null);
  setScreen(`
    <h1 class="big-title">${esc(SUBTITLE).replace("Gehaltsverhandlungen", "Gehalts&shy;verhandlungen")}</h1>
    <p class="lead">Du bist Chef*in einer Bank. Alle wollen mehr Geld. Wie gerecht entlohnst du?</p>
    ${rulesHtml()}
    <form id="f" style="margin-top:16px">
      <input class="field" id="name" maxlength="20" placeholder="Dein Name" autocomplete="off" value="${esc(store.get("lohnspiel-name") || "")}">
      <button class="btn" id="go">Mitspielen</button>
    </form>`, "join");
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim().slice(0, 20);
    if (!name) return;
    document.getElementById("go").disabled = true;
    store.set("lohnspiel-name", name);
    await db.set(`games/${g}/players/${pid}`, { name, t: db.now() });
  };
}

function waitScreen() {
  updateHud(null);
  setScreen(`
    <div class="center" style="margin-top:28px">
      <div class="pulse">💼</div>
      <h1 class="big-title">Hallo ${esc(me.name)}!</h1>
      <p class="lead">Du bist drin. Gleich geht's los, schau auf den Beamer.</p>
    </div>${rulesHtml()}`, "wait");
}

function startRun() {
  run = { id: randomId(6), answers: [], startedAt: db.now() };
  view = "card";
  render();
}

function cardScreen() {
  const i = run.answers.length;
  const s = play(run.answers);
  if (s.over || s.done) return; // letzte Sprechblase läuft noch
  updateHud(s);
  const c = s.next;
  if (setScreen(`
    <div class="card ${c.extra ? "extra" : ""}">${card(c, { i: s.base, total: CARDS.length })}</div>
    <div class="options">
      ${c.options.map((o, k) => `<button class="opt" data-letter="${LETTERS[k]}" data-k="${k}"><span>${esc(o.label)}</span><span class="cost ${o.cost > 0 ? "neg" : ""}">${o.cost > 0 ? "−" + euro(o.cost) : "0 €"}</span></button>`).join("")}
    </div>`, `card-${run.id}-${i}`)) {
    app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => choose(+b.dataset.k)));
  }
}

function choose(k) {
  if (!open() || view !== "card" || bubbleTimer) return;
  const before = play(run.answers);
  run.answers.push(k);
  const s = play(run.answers);
  const last = s.over || s.done;
  if (last) { finishRun(s); updateHud(s); }
  else render(); // nächste Karte liegt schon unter der Sprechblase
  flashHud(before, s);
  showBubble(run.answers.length - 1, last);
}

function flashHud(a, b) {
  const fl = (el, d, txt) => {
    if (!d) return;
    el.classList.remove("flash-bad", "flash-good"); void el.offsetWidth; el.classList.add(d < 0 ? "flash-bad" : "flash-good");
    const f = document.createElement("span");
    f.className = "floatd " + (d < 0 ? "bad" : "good"); f.textContent = txt;
    el.appendChild(f); setTimeout(() => f.remove(), 2600);
  };
  const db_ = b.budget - a.budget, dt = b.team - a.team;
  fl(document.getElementById("hBudget"), db_, (db_ > 0 ? "+" : "−") + euro(Math.abs(db_)));
  fl(document.getElementById("hTeamN").parentElement, dt, (dt > 0 ? "+" : "") + dt);
}

function showBubble(i, last) {
  const h = play(run.answers).history[i], c = h.card, o = h.o;
  const wrap = document.createElement("div");
  wrap.className = "bubblewrap";
  wrap.innerHTML = `<div class="bubble">
      <div class="bhead"><div class="avatar">${avatar(c.id)}</div><div class="btext">${esc(o.reaction)}</div></div>
      <div class="deltas big">${delta(costOf(o), o.team)}</div>
      <div class="bbar"><i style="animation-duration:${REACTION_MS}ms"></i></div>
      <div class="btap">Antippen = weiter · Halten = Pause</div>
    </div>`;
  document.body.appendChild(wrap);
  const done = () => {
    if (!bubbleTimer) return;
    clearTimeout(bubbleTimer); bubbleTimer = null;
    wrap.classList.add("out");
    setTimeout(() => wrap.remove(), 250);
    if (last) { view = "end"; render(); }
  };
  // Wie bei einer Instagram-Story: Antippen = weiter, Gedrückt halten = Pause
  const bar = wrap.querySelector(".bbar i");
  let left = REACTION_MS, startT = Date.now(), downT = 0;
  const pause = () => {
    if (!bubbleTimer || bubbleTimer === -1) return;
    clearTimeout(bubbleTimer); bubbleTimer = -1;
    left -= Date.now() - startT;
    bar.style.animationPlayState = "paused"; wrap.classList.add("held");
  };
  const resume = () => {
    if (bubbleTimer !== -1) return;
    startT = Date.now(); bubbleTimer = setTimeout(done, Math.max(0, left));
    bar.style.animationPlayState = "running"; wrap.classList.remove("held");
  };
  bubbleTimer = setTimeout(done, REACTION_MS);
  wrap.addEventListener("pointerdown", (e) => { e.preventDefault(); downT = Date.now(); pause(); });
  wrap.addEventListener("pointerup", () => { if (Date.now() - downT < 250) done(); else resume(); });
  wrap.addEventListener("pointercancel", resume);
  wrap.addEventListener("pointerleave", resume);
  wrap.addEventListener("contextmenu", (e) => e.preventDefault());
}

async function finishRun(s) {
  const sc = score(s);
  const best = me.best ?? -1;
  const who = s.history[s.history.length - 1].card.name;
  const ev = s.over === "budget" ? `wurde nach ${who} vom Aufsichtsrat gefeuert 📞`
    : s.over === "team" ? `hat bei ${who} das Team verloren 🚪`
    : `hat durchgehalten: ${sc} Punkte 🎉`;
  const picks = Object.fromEntries(s.history.map((h) => [h.id, h.opt]));
  const upd = { [`runs/${pid}/${run.id}`]: { answers: run.answers, picks, score: sc, month: s.month, over: s.over || null, t: db.now() } };
  if (sc > best) Object.assign(upd, { [`players/${pid}/best`]: sc, [`players/${pid}/bestPicks`]: picks });
  upd[`feed/${db.now()}_${pid}`] = { name: me.name, text: ev, t: db.now() };
  await db.update(`games/${g}`, upd);
}

function endScreen() {
  const s = play(run.answers);
  updateHud(s);
  const sc = score(s);
  const head = s.over === "budget" ? { e: "📞", t: "Gefeuert!", x: `Bei ${s.history[s.history.length - 1].card.name} ist das Budget gesprengt. Der Aufsichtsrat hat angerufen.` }
    : s.over === "team" ? { e: "🚪", t: "Dein Team ist weg!", x: `Bei ${s.history[s.history.length - 1].card.name} ist die Teamzufriedenheit im Keller. Reihenweise Kündigungen.` }
    : { e: "🎉", t: "Überlebt!", x: "Du hast alle Gespräche überstanden. Geht da noch mehr?" };
  setScreen(`
    <div class="card center">
      <div class="type-emoji">${head.e}</div>
      <h2 class="verdict ${s.over ? "bad" : ""}">${esc(head.t)}</h2>
      <p class="situation">${esc(head.x)}</p>
      <div class="bigscore"><b>${sc}</b><span>Punkte</span></div>
      <div class="stats">
        <div><b class="${s.budget < 0 ? "neg" : ""}">${euro(s.budget)}</b><span>Budget</span></div>
        <div><b>${s.team}</b><span>Team&shy;zufriedenheit</span></div>
        <div><b>${s.matches}/${s.base}</b><span>wie die Bank</span></div>
      </div>
      <p class="source" style="margin-top:12px">Dein bester Versuch: ${Math.max(sc, me.best ?? 0) === 1 ? "1 Punkt" : Math.max(sc, me.best ?? 0) + " Punkte"}</p>
    </div>
    ${open() ? `<button class="btn" id="again">Nochmal spielen 🔁</button>` : ""}`, `end-${run.id}`);
  const ag = document.getElementById("again");
  if (ag) ag.onclick = startRun;
}

function closedScreen() {
  updateHud(null);
  const best = me.best ?? null;
  const ans = me.bestPicks || {};
  const rows = CARDS.map((c) => {
    const mine = ans[c.id];
    const bankK = c.options.findIndex((o) => o.bank);
    const ok = mine === bankK;
    return `<div class="hist"><span class="hn"><span class="mini">${avatar(c.id)}</span>${esc(c.name)}</span><span>${mine == null ? "–" : ok ? "✅" : "❌ " + esc(c.options[bankK].label)}</span></div>`;
  }).join("");
  setScreen(`
    <div class="card center">
      <div class="type-emoji">⏰</div>
      <h2 class="verdict">Zeit ist um!</h2>
      ${best != null ? `<div class="bigscore"><b>${best}</b><span>dein bester Versuch</span></div>` : `<p class="situation">Du hast keinen Durchgang beendet.</p>`}
    </div>
    ${state.phase === "bank" ? `<div class="card" style="margin-top:14px"><div class="counter">So hätte die Raiffeisenbank entschieden</div>${rows}</div>` : `<p class="waitnote">Schau auf den Beamer 👀</p>`}`, `closed-${state.phase}-${best}`);
}

function render() {
  if (!state) return setScreen(`<p class="lead">Dieses Spiel gibt es nicht (mehr). Scanne den QR-Code am Beamer noch einmal.</p>`, "nostate");
  if (!me) return joinScreen();
  if (state.phase === "lobby") return waitScreen();
  if (state.phase === "play") {
    if (!run) return startRun();
    if (view === "card") return cardScreen();
    return endScreen();
  }
  // Zeit um: laufenden Versuch abbrechen
  if (run && view !== "end" && !bubbleTimer) run = null;
  return closedScreen();
}

(async () => {
  if (!g) return noGame();
  db = await connect();
  pid = session.get("lohnspiel-pid-" + g) || randomId();
  session.set("lohnspiel-pid-" + g, pid);
  db.onValue(`games/${g}/state`, (v) => { state = v; render(); });
  db.onValue(`games/${g}/players/${pid}`, (v) => { me = v; render(); });
})().catch((e) => { app.innerHTML = `<p class="lead">Verbindung fehlgeschlagen: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
