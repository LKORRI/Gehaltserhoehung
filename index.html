<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gehaltserhöhung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>Gehaltserhöhung</div>
    <div class="hud hidden" id="hud">
      <span class="chip-s" id="hBudget"></span>
      <span class="chip-s">😊 <span class="mbar"><span id="hTeam"></span></span> <span id="hTeamN"></span></span>
    </div>
  </div>
  <div id="app" class="screen"><p class="lead">Verbinde …</p></div>
</div>

<script type="module">
import { connect } from "./db.js";
import { CARDS, START_BUDGET, START_TEAM, SUBTITLE, MAX_SCORE, REACTION_MS, play, score, euro } from "./cards.js";
import { card, delta, esc, LETTERS, randomId, store, session, avatar } from "./ui.js";
import { moodOf } from "./avatars.js";

const app = document.getElementById("app");
const hud = document.getElementById("hud");
const params = new URLSearchParams(location.search);
const g = (params.get("g") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

let db, pid, me = null, state = null;
let run = null; // { id, answers: [], startedAt }
let view = "intro"; // intro | card | end
let bubbleTimer = null;
let lastKey = "";

function setScreen(html, key) {
  if (key && key === lastKey) return false;
  lastKey = key || "";
  app.innerHTML = html;
  window.scrollTo(0, 0);
  return true;
}

function updateHud(s) {
  if (!s) return hud.classList.add("hidden");
  hud.classList.remove("hidden");
  const b = document.getElementById("hBudget");
  b.textContent = "💰 " + euro(s.budget);
  b.classList.toggle("neg", s.budget < 0);
  document.getElementById("hTeam").style.width = Math.max(0, Math.min(100, s.team)) + "%";
  document.getElementById("hTeamN").textContent = s.team;
}

const open = () => state && state.phase === "play";

function noGame() {
  setScreen(`
    <h1 class="big-title">Willkommen! 👋</h1>
    <p class="lead">Scanne den QR-Code am Beamer oder gib den Spielcode ein.</p>
    <form id="f"><input class="field" id="code" maxlength="6" placeholder="Spielcode" autocomplete="off" style="text-transform:uppercase">
    <button class="btn">Weiter</button></form>`, "nogame");
  document.getElementById("f").onsubmit = (e) => {
    e.preventDefault();
    const c = document.getElementById("code").value.trim().toUpperCase();
    if (c) location.search = "?g=" + encodeURIComponent(c) + (params.has("local") ? "&local" : "");
  };
}

function rulesHtml() {
  return `
    <div class="rules">
      <div>💬 <b>${CARDS.length} Leute wollen mehr Geld.</b> Du wählst jeweils eine von 3 Antworten.</div>
      <div>💰 <b>Budget</b> ${euro(START_BUDGET)} · 😊 <b>Teamfrieden</b> ${START_TEAM}. Fällt eins unter 0, <b>fliegst du raus.</b></div>
      <div>🏆 Am Ende zählen Teamfrieden + Restbudget. <b>Perfekt: ${MAX_SCORE} Punkte.</b> Du kannst so oft spielen, wie du willst.</div>
    </div>`;
}

function joinScreen() {
  updateHud(null);
  setScreen(`
    <h1 class="big-title">${esc(SUBTITLE)}</h1>
    <p class="lead">Du bist Chef*in einer Bank. Alle wollen mehr Geld. Wie gerecht entlohnst du?</p>
    ${rulesHtml()}
    <form id="f" style="margin-top:16px">
      <input class="field" id="name" maxlength="20" placeholder="Dein Name" autocomplete="off" value="${esc(store.get("lohnspiel-name") || "")}">
      <button class="btn" id="go">Mitspielen</button>
    </form>`, "join");
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim().slice(0, 20);
    if (!name) return;
    document.getElementById("go").disabled = true;
    store.set("lohnspiel-name", name);
    await db.set(`games/${g}/players/${pid}`, { name, t: db.now() });
  };
}

function waitScreen() {
  updateHud(null);
  setScreen(`
    <div class="center" style="margin-top:28px">
      <div class="pulse">💼</div>
      <h1 class="big-title">Hallo ${esc(me.name)}!</h1>
      <p class="lead">Du bist drin. Gleich geht's los, schau auf den Beamer.</p>
    </div>${rulesHtml()}`, "wait");
}

function startRun() {
  run = { id: randomId(6), answers: [], startedAt: db.now() };
  view = "card";
  render();
}

function cardScreen() {
  const i = run.answers.length;
  const s = play(run.answers);
  if (s.over || s.done) return; // letzte Sprechblase läuft noch
  updateHud(s);
  const c = CARDS[i];
  if (setScreen(`
    <div class="card">${card(c, { i, total: CARDS.length })}</div>
    <div class="options">
      ${c.options.map((o, k) => `<button class="opt" data-letter="${LETTERS[k]}" data-k="${k}">${esc(o.label)}</button>`).join("")}
    </div>`, `card-${run.id}-${i}`)) {
    app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => choose(+b.dataset.k)));
  }
}

function choose(k) {
  if (!open() || view !== "card" || bubbleTimer) return;
  const before = play(run.answers);
  run.answers.push(k);
  const s = play(run.answers);
  const last = s.over || s.done;
  if (last) { finishRun(s); updateHud(s); }
  else render(); // nächste Karte liegt schon unter der Sprechblase
  flashHud(before, s);
  showBubble(run.answers.length - 1, last);
}

function flashHud(a, b) {
  const fl = (el, d) => { if (!d) return; el.classList.remove("flash-bad", "flash-good"); void el.offsetWidth; el.classList.add(d < 0 ? "flash-bad" : "flash-good"); };
  fl(document.getElementById("hBudget"), b.budget - a.budget);
  fl(document.getElementById("hTeamN").parentElement, b.team - a.team);
}

function showBubble(i, last) {
  const c = CARDS[i], o = c.options[run.answers[i]];
  const wrap = document.createElement("div");
  wrap.className = "bubblewrap";
  wrap.innerHTML = `<div class="bubble">
      <div class="bhead"><div class="avatar">${avatar(c.id, moodOf(o))}</div><div class="btext">${esc(o.reaction)}</div></div>
      <div class="deltas">${delta(o.cost, o.team)}</div>
      <div class="bbar"><i style="animation-duration:${REACTION_MS}ms"></i></div>
    </div>`;
  document.body.appendChild(wrap);
  const done = () => {
    if (!bubbleTimer) return;
    clearTimeout(bubbleTimer); bubbleTimer = null;
    wrap.classList.add("out");
    setTimeout(() => wrap.remove(), 250);
    if (last) { view = "end"; render(); }
  };
  bubbleTimer = setTimeout(done, REACTION_MS);
  wrap.onclick = done; // Antippen überspringt
}

async function finishRun(s) {
  const sc = score(s);
  const best = me.best ?? -1;
  const who = CARDS[s.month - 1].name;
  const ev = s.over === "budget" ? `wurde nach ${who} vom Aufsichtsrat gefeuert 📞`
    : s.over === "team" ? `hat bei ${who} das Team verloren 🚪`
    : sc === MAX_SCORE ? `hat ${MAX_SCORE} Punkte, perfekt! 🏆` : `hat durchgehalten: ${sc} Punkte 🎉`;
  const upd = { [`runs/${pid}/${run.id}`]: { answers: run.answers, score: sc, month: s.month, over: s.over || null, t: db.now() } };
  if (sc > best) Object.assign(upd, { [`players/${pid}/best`]: sc, [`players/${pid}/bestAnswers`]: run.answers });
  upd[`feed/${db.now()}_${pid}`] = { name: me.name, text: ev, t: db.now() };
  await db.update(`games/${g}`, upd);
}

function endScreen() {
  const s = play(run.answers);
  updateHud(s);
  const sc = score(s);
  const head = s.over === "budget" ? { e: "📞", t: "Gefeuert!", x: `Nach Gespräch ${s.month} ist das Budget gesprengt. Der Aufsichtsrat hat angerufen.` }
    : s.over === "team" ? { e: "🚪", t: "Dein Team ist weg!", x: `Nach Gespräch ${s.month} ist der Teamfrieden im Keller. Reihenweise Kündigungen.` }
    : sc === MAX_SCORE ? { e: "🏆", t: "Perfekt!", x: "Du entscheidest genau wie die echte Raiffeisenbank. Respekt." }
    : { e: "🎉", t: "Überlebt!", x: "Gar nicht schlecht. Aber da geht noch mehr." };
  setScreen(`
    <div class="card center">
      <div class="type-emoji">${head.e}</div>
      <h2 class="verdict ${s.over ? "bad" : ""}">${esc(head.t)}</h2>
      <p class="situation">${esc(head.x)}</p>
      <div class="bigscore"><b>${sc}</b><span>von ${MAX_SCORE} Punkten</span></div>
      <div class="stats">
        <div><b class="${s.budget < 0 ? "neg" : ""}">${euro(s.budget)}</b><span>Budget</span></div>
        <div><b>${s.team}</b><span>Teamfrieden</span></div>
        <div><b>${s.matches}/${s.month}</b><span>wie die Bank</span></div>
      </div>
      <p class="source" style="margin-top:12px">Dein bester Versuch: ${Math.max(sc, me.best ?? 0)} Punkte</p>
    </div>
    ${open() ? `<button class="btn" id="again">Nochmal spielen 🔁</button>` : ""}`, `end-${run.id}`);
  const ag = document.getElementById("again");
  if (ag) ag.onclick = startRun;
}

function closedScreen() {
  updateHud(null);
  const best = me.best ?? null;
  const ans = me.bestAnswers || [];
  const rows = CARDS.map((c, i) => {
    const mine = ans[i];
    const bankK = c.options.findIndex((o) => o.bank);
    const ok = mine === bankK;
    return `<div class="hist"><span class="hn"><span class="mini">${avatar(c.id)}</span>${esc(c.name)}</span><span>${mine == null ? "–" : ok ? "✅" : "❌ " + esc(c.options[bankK].label)}</span></div>`;
  }).join("");
  setScreen(`
    <div class="card center">
      <div class="type-emoji">⏰</div>
      <h2 class="verdict">Zeit ist um!</h2>
      ${best != null ? `<div class="bigscore"><b>${best}</b><span>dein bester Versuch · max. ${MAX_SCORE}</span></div>` : `<p class="situation">Du hast keinen Durchgang beendet.</p>`}
    </div>
    ${state.phase === "bank" ? `<div class="card" style="margin-top:14px"><div class="counter">So hätte die Raiffeisenbank entschieden</div>${rows}</div>` : `<p class="waitnote">Schau auf den Beamer 👀</p>`}`, `closed-${state.phase}-${best}`);
}

function render() {
  if (!state) return setScreen(`<p class="lead">Dieses Spiel gibt es nicht (mehr). Scanne den QR-Code am Beamer noch einmal.</p>`, "nostate");
  if (!me) return joinScreen();
  if (state.phase === "lobby") return waitScreen();
  if (state.phase === "play") {
    if (!run) return startRun();
    if (view === "card") return cardScreen();
    return endScreen();
  }
  // Zeit um: laufenden Versuch abbrechen
  if (run && view !== "end" && !bubbleTimer) run = null;
  return closedScreen();
}

(async () => {
  if (!g) return noGame();
  db = await connect();
  pid = session.get("lohnspiel-pid-" + g) || randomId();
  session.set("lohnspiel-pid-" + g, pid);
  db.onValue(`games/${g}/state`, (v) => { state = v; render(); });
  db.onValue(`games/${g}/players/${pid}`, (v) => { me = v; render(); });
})().catch((e) => { app.innerHTML = `<p class="lead">Verbindung fehlgeschlagen: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
