<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gehaltserhöhung – Beamer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="vendor/qrcode.js"></script>
</head>
<body>
<div class="host">
  <header>
    <div class="brand"><span class="dot"></span>Gehaltserhöhung · Relative Lohngerechtigkeit in der Praxis</div>
    <div id="hinfo" class="htimer"></div>
  </header>
  <main id="main"></main>
  <footer>
    <span><span id="status"></span> · <span class="credit">Illustrationen: Freepik</span></span>
    <div class="ctrl">
      <button id="bReset" title="Neues Spiel mit neuem Code">Neues Spiel</button>
      <button id="bBack" title="Pfeil links">Zurück</button>
      <button id="bNext" class="primary" title="Leertaste oder Pfeil rechts">Weiter ▶</button>
    </div>
  </footer>
</div>

<script type="module">
import { connect } from "./db.js";
import { CARDS, START_BUDGET, START_TEAM, SUBTITLE, PLAY_SECONDS, euro } from "./cards.js";
import { esc, store, avatar } from "./ui.js";

const main = document.getElementById("main");
const hinfo = document.getElementById("hinfo");
const statusEl = document.getElementById("status");
const params = new URLSearchParams(location.search);
const localFlag = params.has("local") ? "&local" : "";
const playSeconds = +(params.get("sek") || PLAY_SECONDS);

let db, g, state = null, players = {}, runs = {}, feed = {}, tick = null, lastKey = "";

const newCode = () => {
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(4)), (x) => a[x % a.length]).join("");
};
const playerUrl = () => `${new URL("./", location.href).href}?g=${g}${localFlag}`;

function setMain(html, key) {
  if (key && key === lastKey) return false;
  lastKey = key || "";
  main.innerHTML = html;
  return true;
}

function qrSvg(text) {
  const qr = qrcode(0, "M"); qr.addData(text); qr.make();
  return qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
}

const crew = () => CARDS.map((c) => c.id).map((id) => `<span class="mini">${avatar(id)}</span>`).join("");

function chips(el) {
  const names = Object.values(players).sort((a, b) => a.t - b.t);
  const have = new Set([...el.children].map((c) => c.dataset.k));
  names.forEach((p) => {
    const k = p.name + p.t;
    if (have.has(k)) return;
    const s = document.createElement("span");
    s.className = "chip"; s.dataset.k = k; s.textContent = p.name;
    el.appendChild(s);
  });
}

function lobby() {
  const url = playerUrl();
  setMain(`
    <div class="lobby">
      <div>
        <h1>Gehalts&shy;erhöhung<em>!</em></h1>
        <p class="lead"><b>${esc(SUBTITLE)}</b> ${CARDS.length} Leute wollen mehr Geld. Du hast ${euro(START_BUDGET)} Budget und ${START_TEAM} Teamzufriedenheit. Fällt eins unter 0, fliegst du raus.</p>
        <div class="goal">🏆 Wer holt die meisten Punkte?</div>
        <div class="crew">${crew()}</div>
        <div class="count" id="cnt"></div>
        <div class="players" id="pl"></div>
      </div>
      <div class="qrbox">${qrSvg(url)}<div class="url">${esc(url.replace(/^https?:\/\//, ""))}</div><div class="source">Spielcode ${esc(g)}</div></div>
    </div>`, "lobby");
  const n = Object.keys(players).length;
  document.getElementById("cnt").textContent = n === 1 ? "1 Chef*in ist dabei" : `${n} Chefs sind dabei`;
  chips(document.getElementById("pl"));
  hinfo.innerHTML = `<span>Leertaste startet ${Math.round(playSeconds / 60)} Minuten Spielzeit</span>`;
}

function ranking() {
  return Object.entries(players).filter(([, p]) => p.best != null).map(([id, p]) => ({ id, name: p.name, best: p.best, tries: Object.keys(runs[id] || {}).length }))
    .sort((a, b) => b.best - a.best);
}

function allRuns() {
  return Object.values(runs).flatMap((r) => Object.values(r || {}));
}

function playView() {
  const rows = ranking();
  const events = Object.values(feed).sort((a, b) => b.t - a.t).slice(0, 6);
  const nRuns = allRuns().length;
  const medals = ["🥇", "🥈", "🥉"];
  setMain(`
    <div class="playgrid">
      <div class="leftcol">
        <div class="bigclock" id="clock"></div>
        <div class="qrmini">${qrSvg(playerUrl())}<span>Noch nicht dabei?<br>Jetzt scannen!</span></div>
        <div class="ticker">
          <div class="counter">Live aus der Chefetage</div>
          ${events.map((e) => `<div class="tick"><b>${esc(e.name)}</b> ${esc(e.text)}</div>`).join("") || `<div class="tick muted2">Noch niemand ist durch …</div>`}
        </div>
      </div>
      <div>
        <h2 class="lbtitle">Rangliste <span class="muted">${nRuns} ${nRuns === 1 ? "Versuch" : "Versuche"}</span></h2>
        <div class="board">
          ${rows.slice(0, 8).map((r, i) => `<div class="brow"><span class="pos">${medals[i] || i + 1}</span><span>${esc(r.name)} <small>${r.tries}× gespielt</small></span><span class="pts">${r.best}</span></div>`).join("") || `<p class="empty">Gleich tauchen hier die ersten Ergebnisse auf …</p>`}
        </div>
      </div>
    </div>`, "play-" + JSON.stringify(rows.slice(0, 8).map((r) => [r.name, r.best, r.tries])) + events.map((e) => e.t).join(",") + nRuns);
  clearInterval(tick);
  const upd = () => {
    const left = Math.max(0, Math.ceil(((state.endsAt || 0) - db.now()) / 1000));
    const el = document.getElementById("clock");
    if (el) { el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; el.classList.toggle("hot", left <= 30); }
    hinfo.innerHTML = `<span>${Object.keys(players).length} spielen mit</span>`;
    if (left <= 0 && state.phase === "play") { clearInterval(tick); go(+1); }
  };
  upd(); tick = setInterval(upd, 500);
}

function final() {
  clearInterval(tick);
  const rows = ranking();
  const rs = allRuns();
  const fired = rs.filter((r) => r.over === "budget").length;
  const lost = rs.filter((r) => r.over === "team").length;
  const survived = rs.filter((r) => !r.over).length;
  const pod = [rows[1], rows[0], rows[2]];
  setMain(`
    <div class="final">
      <div>
        <h2>Die gerechtesten Chefs 🏆</h2>
        <div class="podium">
          ${pod.map((r, i) => r ? `<div class="pod p${[2, 1, 3][i]}"><div class="pname">${esc(r.name)}</div><div class="ppts">${r.best}</div><div class="pblock">${[2, 1, 3][i]}</div></div>` : `<div class="pod"></div>`).join("")}
        </div>
      </div>
      <div class="bigstats">
        <div class="bigstat"><b>📞 ${fired}</b><span>Mal vom Aufsichtsrat gefeuert</span></div>
        <div class="bigstat"><b>🚪 ${lost}</b><span>Mal das Team verloren</span></div>
        <div class="bigstat"><b>🎉 ${survived}</b><span>Mal alle Gespräche überlebt</span></div>
      </div>
    </div>`, "final-" + rows.map((r) => r.best).join(","));
  hinfo.innerHTML = `<span>${rs.length} Versuche insgesamt</span>`;
}

function bank() {
  const rs = allRuns();
  setMain(`
    <div class="bankview">
      <h2>So hätte die Raiffeisenbank entschieden 🏦</h2>
      <div class="bankgrid12">
        ${CARDS.map((c, i) => {
          const k = c.options.findIndex((o) => o.bank);
          const reached = rs.filter((r) => r.picks && r.picks[c.id] != null);
          const same = reached.filter((r) => r.picks[c.id] === k).length;
          const pct = reached.length ? Math.round((same / reached.length) * 100) : null;
          return `<div class="bcard">
            <div class="reveal-head"><span class="mini">${avatar(c.id)}</span>${esc(c.name)}<span class="pill">${esc(c.criterion)}</span></div>
            <div class="bdec">${esc(c.options[k].label)}</div>
            <div class="bfoot"><span>Interview, Fr. ${esc(c.source.replace(/^Fragen? /, "").replace(" und ", ", "))}</span>${pct != null ? `<b>${pct} % von euch</b>` : ""}</div>
          </div>`;
        }).join("")}
      </div>
    </div>`, "bank-" + rs.length);
  hinfo.innerHTML = "";
}

function render() {
  if (!state) return;
  ({ lobby, play: playView, final, bank })[state.phase]?.();
  statusEl.textContent = `Spielcode ${g} · ${db.mode === "local" ? "lokaler Testmodus" : "live"} · Leertaste = weiter`;
}

const STEPS = ["lobby", "play", "final", "bank"];
async function go(d) {
  const i = Math.max(0, Math.min(STEPS.length - 1, STEPS.indexOf(state.phase) + d));
  const phase = STEPS[i];
  if (phase === state.phase) return;
  const next = { phase, startedAt: db.now() };
  if (phase === "play") next.endsAt = state.phase === "lobby" ? db.now() + playSeconds * 1000 : state.endsAt || db.now() + 60000;
  if (phase === "play" && next.endsAt <= db.now()) next.endsAt = db.now() + 60000; // zurück in die Spielzeit: 1 Minute extra
  await db.set(`games/${g}/state`, next);
}

async function newGame() {
  g = newCode();
  store.set("lohnspiel-host-game", g);
  history.replaceState(null, "", `?g=${g}${localFlag}${params.get("sek") ? "&sek=" + playSeconds : ""}`);
  lastKey = "";
  await db.set(`games/${g}`, { state: { phase: "lobby", startedAt: db.now() }, created: db.now() });
  subscribe();
}

let unsubs = [];
function subscribe() {
  unsubs.forEach((u) => u && u()); unsubs = [];
  unsubs.push(db.onValue(`games/${g}/state`, (v) => { state = v; render(); }));
  unsubs.push(db.onValue(`games/${g}/players`, (v) => { players = v || {}; render(); }));
  unsubs.push(db.onValue(`games/${g}/runs`, (v) => { runs = v || {}; render(); }));
  unsubs.push(db.onValue(`games/${g}/feed`, (v) => { feed = v || {}; render(); }));
}

document.getElementById("bNext").onclick = () => go(+1);
document.getElementById("bBack").onclick = () => go(-1);
document.getElementById("bReset").onclick = () => { if (confirm("Neues Spiel mit neuem QR-Code starten?")) newGame(); };
document.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(+1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
});

(async () => {
  db = await connect();
  g = (params.get("g") || "").toUpperCase();
  if (g && (await db.get(`games/${g}/state`))) subscribe();
  else await newGame();
})().catch((e) => { main.innerHTML = `<p class="empty">Verbindung fehlgeschlagen: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
